<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

.profile-container {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.profile-card {
    width: 350px;
    max-width: 100%;

    background: white;

    padding: 30px 20px;

    display: flex;
    flex-direction: column;
    align-items: center;

    border-radius: 12px;

    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

/* Circular image */
.profile-image {
    width: 120px;
    height: 120px;

    border-radius: 50%;

    object-fit: cover;

    margin-bottom: 20px;
}

.profile-card h2 {
    margin: 5px 0;

    text-align: center;
}

.designation {
    margin: 5px 0;

    color: #666;

    text-align: center;
}

/* Hover effect */
.profile-card:hover {
    transform: translateY(-10px);

    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
}

/* Smaller screens */
@media (max-width: 500px) {

    .profile-card {
        width: 90%;
        padding: 25px 15px;
    }

    .profile-image {
        width: 100px;
        height: 100px;
    }
}
    </style>
</head>
<body>

    <div class="profile-container">

        <div class="profile-card">

            <img
                src="c:\Users\Hp\OneDrive\Desktop\Anki\PHOTO.jpg"
                alt="Profile Image"
                class="profile-image"
            >

            <h2>Ankitha D</h2>

            <p class="designation">
                Software Developer
            </p>

        </div>

    </div>

</body>
</html>
