<!DOCTYPE html>
<html>
<head>
    <title>CSS Loading Spinner</title>
    <style>
        body {
    height: 100vh;
    margin: 0;

    display: flex;
    justify-content: center;
    align-items: center;
}

.spinner {
    width: 50px;
    height: 50px;

    border: 6px solid #ddd;
    border-top: 6px solid #3498db;

    border-radius: 50%;

    animation: spin 1s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}
    </style>
</head>
<body>

    <div class="spinner"></div>

</body>
</html>
