<!DOCTYPE html>
<html>
<head>
    <title>CSS Tooltip</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.tooltip-container {
    position: relative;
    display: inline-block;
}

.info-icon {
    width: 30px;
    height: 30px;
    background: #007bff;
    color: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-weight: bold;
}

.tooltip {
    position: absolute;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);

    background: #222;
    color: white;
    padding: 10px 15px;
    border-radius: 6px;

    width: 200px;
    text-align: center;

    opacity: 0;
    visibility: hidden;

    transition: opacity 0.3s ease;
}

/* Show tooltip when hovering */
.tooltip-container:hover .tooltip {
    opacity: 1;
    visibility: visible;
}

/* Small arrow */
.tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);

    border-width: 6px;
    border-style: solid;
    border-color: #222 transparent transparent transparent;
}
    </style>
</head>
<body>

    <div class="tooltip-container">
        <span class="info-icon">?</span>

        <div class="tooltip">
            This is additional information about the icon.
        </div>
    </div>

</body>
</html>
